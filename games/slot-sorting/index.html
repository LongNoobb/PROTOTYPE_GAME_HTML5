<script type="module">
try {

poseCamera();
scene.add(new THREE.HemisphereLight(0xfffbff, 0x8455c1, 0.8));
const sun = new THREE.DirectionalLight(0xfff5e7, 2.0);

scene.add(sun);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.7); rimLight.position.set(-3, 6, -1); scene.add(rimLight);

  frame.style.width = w + 'px'; frame.style.height = h + 'px';
  document.documentElement.style.setProperty('--u', (w / 720) + 'px');

// ================= materials =================

  bottle: new THREE.MeshPhysicalMaterial({ ...glassOpts, color: 0xffe5f7, transmission: 0, opacity: 0.30, thickness: 0.025, attenuationColor: new THREE.Color(0xffe3f7), attenuationDistance: 4 }),

  // clipShadows: reel strips extend past the window, and their hidden collars must not cast shadows
  collarClip: new THREE.MeshPhysicalMaterial({ color: 0x8da3bc, roughness: 0.32, clearcoat: 0.6, clearcoatRoughness: 0.14, clippingPlanes: CLIP, clipShadows: true }),
  seamClip: new THREE.MeshBasicMaterial({ color: 0x8babc3, transparent: true, opacity: 0.13, clippingPlanes: CLIP }),
  plateClip: new THREE.MeshPhysicalMaterial({ color: 0x304154, roughness: 0.65, clearcoat: 0.1, clippingPlanes: CLIP }),
  boltClip: new THREE.MeshStandardMaterial({ color: 0x60768b, clippingPlanes: CLIP }),
  arrowClip: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.35, clippingPlanes: CLIP }),
  purple: new THREE.MeshPhysicalMaterial({ color: 0x68438f, roughness: 0.31, metalness: 0.02, clearcoat: 0.65, clearcoatRoughness: 0.16 }),
  purpleDark: new THREE.MeshPhysicalMaterial({ color: 0x39264f, roughness: 0.40, clearcoat: 0.45 }),
  purpleLight: new THREE.MeshPhysicalMaterial({ color: 0x997bb7, roughness: 0.29, clearcoat: 0.6 }),
  gold: new THREE.MeshPhysicalMaterial({ color: 0xdab875, roughness: 0.32, metalness: 0.08, clearcoat: 0.55, emissive: 0x000000 }),
  goldDark: new THREE.MeshPhysicalMaterial({ color: 0x45586a, roughness: 0.50, metalness: 0.08, clearcoat: 0.2 }),
  goldLight: new THREE.MeshPhysicalMaterial({ color: 0xffe3aa, roughness: 0.26, metalness: 0.04, clearcoat: 0.6 }),
  window: new THREE.MeshPhysicalMaterial({ color: 0x1b2838, roughness: 0.78, clearcoat: 0 }),
  white: new THREE.MeshPhysicalMaterial({ color: 0xfff4e4, roughness: 0.35, clearcoat: 0.5 }),
  cream: new THREE.MeshPhysicalMaterial({ color: 0xf0d6b4, roughness: 0.4 }),
  chain: new THREE.MeshPhysicalMaterial({ color: 0x9aa3b5, roughness: 0.3, metalness: 0.6, clearcoat: 1 }),
  frontGlass: new THREE.MeshPhysicalMaterial({ color: 0xf4faff, transparent: true, opacity: 0.012, roughness: 0.22, clearcoat: 0.25, depthWrite: false, envMapIntensity: 0.4 }),
};
const BALL_MAT = {}, PLASTIC = {}, PLASTIC_DK = {};
// True lit 3D candy spheres: highlights follow the studio and camera.
for (const k of Core.COLOR_KEYS) {
  BALL_MAT[k] = new THREE.MeshPhysicalMaterial({ color: k === 'Y' ? 0xffdf00 : k === 'R' ? 0xff2145 : HEX[k], roughness: .16, clearcoat: 1, clearcoatRoughness: .025, metalness: 0, envMapIntensity: 1.5 });
  PLASTIC[k] = new THREE.MeshPhysicalMaterial({ color: HEX[k], roughness: 0.19, clearcoat: 1, clearcoatRoughness: 0.06 });
  PLASTIC_DK[k] = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(HEX[k]).multiplyScalar(0.55), roughness: 0.5 });
}
// Same surface as BALL_MAT, white base so the per-instance colour (BALL_MAT[k].color) shows as-is.
const ballInstMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .16, clearcoat: 1, clearcoatRoughness: .025, metalness: 0, envMapIntensity: 1.5 });
let ballInst = null, ballKey = '';
function shadowy(o, cast = true, recv = true) { o.traverse(m => { if (m.isMesh) { m.castShadow = cast; m.receiveShadow = recv; } }); return o; }
// ---- draw-call batching ----
// Static meshes sharing a material are baked into one geometry: fewer draw calls (and shadow
// draws) with the exact same pixels. parts: [{ geo, mat, matrix, cast, recv, order }]
function geoForMerge(geo, matrix, indexed) {

  for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(name)) g.deleteAttribute(name);
  g.clearGroups(); g.morphAttributes = {};
  return g;
}
function mergeParts(parts) {

  for (const p of parts) {
    const key = p.mat.uuid + '|' + !!p.cast + !!p.recv + '|' + (p.order || 0);
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(p);
  }
  const meshes = [];
  for (const list of buckets.values()) {
    const indexed = list.every(p => p.geo.index);
    const geos = list.map(p => geoForMerge(p.geo, p.matrix, indexed));
    const merged = mergeGeometries(geos, false);
    const m = new THREE.Mesh(merged, list[0].mat);
    m.castShadow = !!list[0].cast; m.receiveShadow = !!list[0].recv; m.renderOrder = list[0].order || 0;
    // parts tagged with a `cell` index (in order) let the caller draw only a range of cells:
    // cellStart[j] = first index (or vertex) of cell j's parts, cellStart[last] = total

      const cellStart = []; let at = 0;
      list.forEach((p, i) => { while (cellStart.length <= p.cell) cellStart.push(at); at += indexed ? geos[i].index.count : geos[i].attributes.position.count; });
      cellStart.push(at); m.userData.cellStart = cellStart;

// Collapse every mesh under `root` (relative to root) into merged meshes; root keeps its transform.
function mergeStatic(root) {

  const inv = root.matrixWorld.clone().invert(), parts = [];
  root.traverse(o => { if (o.isMesh && o.visible) parts.push({ geo: o.geometry, mat: o.material, matrix: inv.clone().multiply(o.matrixWorld), cast: o.castShadow, recv: o.receiveShadow, order: o.renderOrder }); });

}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function roundRectShape(w, h, r, cx = 0, cy = 0) {
  const s = new THREE.Shape(), x = cx - w / 2, y = cy - h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);

// ================= pipe cells =================
const OPP = Core.OPP;
function segPairs(seg) {
  if (seg.cross) return [['T', 'B'], ['L', 'R']];
  if (!seg.ports.length) return [];
  if (seg.ports.length === 2) return [[seg.ports[0], seg.ports[1]]];
  const out = [], seen = new Set();
  for (const e of seg.ports) {
    if (e === 'B') continue;
    const x = Core.exitOf(seg, e); if (!x) continue;
    const k = [e, x].sort().join('');
    if (!seen.has(k)) { seen.add(k); out.push([e, x]); }
  }
  return out;
}
function makeCurve(a, b, curvy) {
  const A = V3(PORT[a][0], PORT[a][1], 0), B = V3(PORT[b][0], PORT[b][1], 0);

  collar: art.collarGeometry(COLLAR_R, COLLAR_L),
  seam: new THREE.BoxGeometry(CW, 0.016, 0.01),
  tile: new RoundedBoxGeometry(CW - 0.035, CH - 0.035, 0.22, 2, 0.10),
  plate: new RoundedBoxGeometry(0.72, 0.58, 0.08, 3, 0.08),
  bolt: new THREE.SphereGeometry(0.035, 10, 8),
  arrow: new THREE.ConeGeometry(0.1, 0.22, 3),
  ball: new THREE.SphereGeometry(1, 24, 16),
  glint: new THREE.TorusGeometry(0.35, 0.022, 6, 28),

const reflectionMat = new THREE.MeshBasicMaterial({ color: 0xe7f8ff, transparent: true, opacity: 0.60, depthWrite: false, clippingPlanes: CLIP });

  const shines = curves.flatMap(c => [-1, 1].map(side => {
    const pts = Array.from({ length: 25 }, (_, i) => {
      const t = 0.04 + i / 24 * 0.92, p = c.getPoint(t), tangent = c.getTangent(t);

// One pipe cell as mergeable parts, placed with its centre at y = cy.
function cellParts(code, cy, cell) {
  const { seg, tubes, shines, ports } = cellGeo(code), parts = [];
  const add = (geo, mat, o, extra) => { o.position.y += cy; o.updateMatrix(); parts.push({ geo, mat, matrix: o.matrix.clone(), cell, ...extra }); };
  const at = (x, y, z) => { const o = new THREE.Object3D(); o.position.set(x, y, z); return o; };
  add(G.tile, tileMat, at(0, 0, -0.25), { recv: true });
  add(G.seam, M.seamClip, at(0, CH / 2 - 0.008, -0.3));
  if (!tubes.length) {
    add(G.plate, M.plateClip, at(0, 0, -0.12));
    for (const [bx, by] of [[-0.26, 0.2], [0.26, 0.2], [-0.26, -0.2], [0.26, -0.2]]) add(G.bolt, M.boltClip, at(bx, by, -0.06));
  }
  for (const t of tubes) add(t, M.glassClip, at(0, 0, 0));
  for (const t of shines) add(t, reflectionMat, at(0, 0, 0), { order: 3 });

// reels
// Each reel is one strip of n + ROWS + 3 cells (its sequence repeated), merged per material and
// scrolled as a whole; the window's clipping planes hide what is outside. Cell j of the strip
// shows code seq[j % n] at strip-local y = -j * CH.
let reelStrips = [], segCols = [];
const stripCache = new Map(); // "codes|rows" -> merged meshes (geometry reused across reloads)
function buildReels() {
  reelRoots.forEach(r => r.clear());
  reelStrips = L.reels.map((seq, c) => {
    // per column: each strip's geometry carries its own draw range
    const key = seq.join(',') + '|' + ROWS + '#' + c;
    let meshes = stripCache.get(key);
    if (!meshes) {
      const parts = [];
      for (let j = 0; j < seq.length + ROWS + 3; j++) parts.push(...cellParts(seq[j % seq.length], -j * CH, j));
      meshes = mergeParts(parts); stripCache.set(key, meshes);
    }
    const strip = new THREE.Group(); meshes.forEach(m => strip.add(m.clone())); reelRoots[c].add(strip);
    strip.userData.first = -1;
    return strip;
  });
}
function layoutReels() {
  for (let c = 0; c < NC; c++) {
    const n = L.reels[c].length, p = reels[c].p, base = Math.floor(p) - 1, first = Core.mod(base, n);
    const shift = base - first;     // cell k of the reel = strip cell k - shift
    const strip = reelStrips[c];
    strip.position.y = rowY(0) - (shift - p) * CH;
    // Only the ROWS + 3 cells around the window are drawn; the rest of the strip is skipped
    // instead of being shaded and then clipped away.
    if (strip.userData.first !== first) {
      strip.userData.first = first;
      for (const m of strip.children) {

        m.geometry.setDrawRange(at(first), at(first + ROWS + 3) - at(first));
      }

}

  let direction = -1;
  if (!dropping && settled) {
    const route = Core.nearestRoute(L, logic.pos, 0);
    if (route) { const n = L.reels[0].length; let d = Core.mod(route.pos[0] - logic.pos[0], n); if (d > n / 2) d -= n; direction = d > 0 ? -1 : 1; }
  }
  window.SlotUI.tutorial({ step: tutorial.step, x: (p.x + 1) * 50, y: (1 - p.y) * 50, direction, focusHeight, cueVisible: !overlay && !drag && settled });
}
$('tutorial-skip').onclick = () => { tutorial = null; window.SlotUI.tutorial(null); };

// ================= overlays =================
async function exportModel() {
  try {
    const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
    const model = rig.clone(true);
    model.name = 'Slot Sorting - Tropical Toy 3D';
    model.position.set(0,0,0); model.scale.setScalar(1);
    const prune = node => {
      for (const child of [...node.children]) {
        if (child.isInstancedMesh) { // export resting balls as plain meshes
          for (let i = 0; i < child.count; i++) {
            const m = new THREE.Mesh(child.geometry, child.material.clone());
            child.getMatrixAt(i, m.matrix); m.matrix.decompose(m.position, m.quaternion, m.scale);
            child.getColorAt(i, m.material.color); node.add(m);
          }
          node.remove(child); continue;
        }
        const invisible = child.isMesh && [].concat(child.material).every(m => m.transparent && m.opacity === 0);
        if (!child.visible || child.isSprite || invisible) node.remove(child);
        else prune(child);
      }
    };
    prune(model); model.updateMatrixWorld(true);
    const data = await new GLTFExporter().parseAsync(model, { binary: true, onlyVisible: true });
    const url = URL.createObjectURL(new Blob([data], { type: 'model/gltf-binary' }));
    const a = document.createElement('a'); a.href = url; a.download = 'slot-machine-tropical-3d.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (error) { console.error(error); showToast('Could not export the 3D model. Please try again.', 3); }
}
function refreshHUD() { window.SlotUI.refresh(L, li, vis); }
function closeOverlay() { overlay = null; window.SlotUI.close(); }
function openOverlay(kind) { overlay = kind; window.SlotUI.open(kind); }
window.SlotUI.attach({
  snapshot: () => ({ level: L, index: li, vis, done, levels: LEVELS, soundOn, loseReason, canDrop, phase:state,
    hasProgress: !!auto || dropActive || !reelsSettled() || logic.err > 0 || logic.pend.some(n => n > 0) || logic.rem.some((n,c) => n !== L.balls[c]) || logic.pos.some((n,c) => Core.mod(n,L.reels[c].length) !== Core.mod(L.start[c],L.reels[c].length)) }),
  open: openOverlay, close: closeOverlay, load: loadLevel, hint, spin: shuffleReels, drop: dropFrom,
  tap: () => { ensureAudio(); SFX.tap(); }, sound: value => { soundOn = value; try { localStorage.setItem('slotsort_sound', String(value)); } catch(e) {} }, exportModel,
});

// ================= input =================
const cv = renderer.domElement, ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane(V3(0, 0, 1), 0), hitPt = new THREE.Vector3();
function setRay(e) {
  const r = cv.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function worldY(e) { setRay(e); return ray.ray.intersectPlane(dragPlane, hitPt) ? hitPt.y : null; }
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  if (overlay) return;
  setRay(e);
  const d = ray.intersectObjects(dropTargets, false)[0];
  if (d) { SFX.tap(); dropFrom(d.object.userData.drop); return; }
  const h = ray.intersectObjects(hitPlanes, false)[0];
  if (!h) return;
  const c = h.object.userData.col;
  if (!canDrag(c)) { if (isFixed(c)) { showToast('This column is locked and cannot be moved'); SFX.deny(); } return; }
  const y = worldY(e); if (y == null) return;
  const rl = reels[c]; rl.anim = null; hintSrc = null;
  drag = { c, id: e.pointerId, y0: y, p0: rl.p, lastY: y, lastT: performance.now(), v: 0 };
  try { cv.setPointerCapture(e.pointerId); } catch (err) { }
});
cv.addEventListener('pointermove', e => {
  if (!drag) {
    setRay(e);
    const overBtn = ray.intersectObjects(dropTargets, false).length > 0;
    const h = ray.intersectObjects(hitPlanes, false)[0];
    hoverCol = h ? h.object.userData.col : -1;
    cv.style.cursor = overBtn ? 'pointer' : (!overlay && hoverCol >= 0 && canDrag(hoverCol)) ? 'grab' : 'default';
    return;
  }
  if (e.pointerId !== drag.id) return;
  const y = worldY(e); if (y == null) return;
  cv.style.cursor = 'grabbing';
  const now = performance.now(), dtm = Math.max(1, now - drag.lastT);
  reels[drag.c].p = drag.p0 + (y - drag.y0) / (CH * rigK);          // pipes follow the finger
  drag.v = lerp(drag.v, ((y - drag.lastY) / (CH * rigK)) / (dtm / 1000), 0.4);
  drag.lastY = y; drag.lastT = now;
});
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const c = drag.c, rl = reels[c];
  const v = performance.now() - drag.lastT > 90 ? 0 : drag.v;
  const target = Math.round(rl.p + clamp(v * 0.05, -1, 1));
  drag = null; cv.style.cursor = 'grab';
  snapReel(c, target);
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  setRay(e); const h = ray.intersectObjects(hitPlanes, false)[0];
  if (h && !drag && !overlay) nudgeReel(h.object.userData.col, e.deltaY > 0 ? -1 : 1);
}, { passive: false });
function toggleInspection() {
  inspectionMode = !inspectionMode; poseCamera();
  $('inspect').setAttribute('aria-pressed', String(inspectionMode));
}
$('inspect').setAttribute('aria-pressed', String(inspectionMode));
$('inspect').addEventListener('click', toggleInspection);
window.addEventListener('keydown', e => {
  if (e.target.closest?.('button, input, select') && e.key !== 'Escape') return;
  ensureAudio();
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= '9' && k.length === 1) { if (+k <= NC) dropFrom(+k - 1); }
  else if ('qwe'.includes(k) && k && 'qwe'.indexOf(k) < NC) nudgeReel('qwe'.indexOf(k), 1);
  else if ('asd'.includes(k) && k && 'asd'.indexOf(k) < NC) nudgeReel('asd'.indexOf(k), -1);
  else if (k === ' ') { e.preventDefault(); shuffleReels(); }
  else if (k === 'r') window.SlotUI.requestRestart();
  else if (k === 'h') hint();
  else if (e.key === 'Escape') overlay ? closeOverlay() : openOverlay('menu');
});

// ================= loop =================
loadLevel(window.SLOT_RESUME);
let last = performance.now(), frameNo = 0;
// Adaptive resolution: if the device cannot hold ~40 fps, step the pixel ratio down (never up).
const dprSteps = [2, 1.5, 1.25, 1].filter(r => r < Math.min(window.devicePixelRatio || 1, 2));
let slowFrames = 0, sampledFrames = 0;
function adaptQuality(raw) {
  if (!dprSteps.length || raw > 0.25 || document.visibilityState !== 'visible') return; // ignore stalls / background
  sampledFrames++; if (raw > 1 / 40) slowFrames++;
  if (sampledFrames < 120) return;
  if (slowFrames > 60) { renderer.setPixelRatio(dprSteps.shift()); resize(); shadowsDirty = true; }
  sampledFrames = slowFrames = 0;
}
function frameLoop(now) {
  const raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now;
  // catch size changes no resize event reported (e.g. a stage that started at zero size);
  // checked sparingly because reading layout right after sync()'s DOM writes forces a reflow
  if (++frameNo % 30 === 0) {
    const st = document.getElementById('stage');
    if (st.clientWidth !== sizedW || st.clientHeight !== sizedH) resize();
  }
  if (frameNo > 60) adaptQuality(raw);
  update(dt); sync(); renderer.render(scene, camera);
  requestAnimationFrame(frameLoop);
}
sync(); renderer.render(scene, camera); window.SlotUI.ready();
requestAnimationFrame(frameLoop);
window.__game = {
  get state() { return state; }, get logic() { return logic; }, get vis() { return vis; }, get reels() { return reels; },
  loadLevel, dropFrom, nudgeReel, hint, shuffleReels, toggleInspection, renderer, scene, camera,
  // profiling: { update, sync, render } ms averaged over `frames` simulated frames
  profile(frames = 60) {
    const t = { update: 0, sync: 0, render: 0 }, gl = renderer.getContext();
    for (let i = 0; i < frames; i++) {
      let a = performance.now(); update(1 / 60); t.update += performance.now() - a;
      a = performance.now(); sync(); t.sync += performance.now() - a;
      a = performance.now(); renderer.render(scene, camera); gl.finish(); t.render += performance.now() - a;
    }
    for (const k in t) t[k] = +(t[k] / frames).toFixed(2);
    return { ...t, calls: renderer.info.render.calls, tris: renderer.info.render.triangles, programs: renderer.info.programs.length, geometries: renderer.info.memory.geometries };
  },
  tick(sec) { for (let t = 0; t < sec; t += 1 / 60) update(1 / 60); sync(); renderer.render(scene, camera); },
};
} catch (error) {
  console.error('Slot Sorting could not start:', error);
  if (window.SlotUI) window.SlotUI.bootError();
  else {
    const loading = document.getElementById('loading');
    loading.textContent = 'Could not load the interface. Please reload the page.';
    const retry = document.createElement('button'); retry.textContent = 'Reload'; retry.onclick = () => location.reload(); loading.append(retry);
  }
}
</script>
