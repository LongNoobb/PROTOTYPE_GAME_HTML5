<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#642f31">
  <title>Xưởng bánh · Perfect Shape 3D</title>
  <link rel="stylesheet" href="game.css">
  <script defer src="assets/models.js"></script>
  <script defer src="assets/cannon-es.min.js"></script>
  <script defer src="tray-physics.js"></script>
  <script defer src="mesh-renderer.js"></script>
  <script defer src="bakery-levels.js"></script>
  <script defer src="art.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <main id="viewport" aria-label="Xưởng bánh">
    <div id="stage">
      <canvas id="world" width="540" height="1172" aria-label="Trụ ghép hình và khay bánh"></canvas>
      <section id="home" aria-label="Trang chủ">
        <div class="home-hud">
          <button class="profile glossy" id="profile" aria-label="Chọn màn"></button>
          <div class="hud-pill"><span class="heart-token" id="heart-token"></span><span class="lives-number" id="lives">5</span><span id="life-clock">Đầy</span><button class="plus glossy" id="life-shop" aria-label="Mạng">+</button></div>
          <div class="hud-pill"><span class="coin"></span><span id="coins">100</span><button class="plus glossy" id="coin-shop" aria-label="Xu">+</button></div>
          <button class="gear glossy" id="home-settings" aria-label="Cài đặt"></button>
        </div>
        <div class="bakery-title"><p>PERFECT SHAPE 3D</p><h1>Xưởng bánh</h1></div>
        <button class="play glossy" id="play">Màn 1</button>
        <p id="home-progress">0 / 30 màn</p>
        <nav class="tabs" aria-label="Điều hướng">
          <button id="shop-tab" aria-label="Cửa hàng"></button>
          <button class="selected" id="home-tab" aria-current="page">Tiệm bánh</button>
          <button id="trophy-tab" aria-label="Chọn màn"></button>
        </nav>
      </section>
      <section id="hud" aria-label="Điều khiển" hidden>
        <div class="level-chip" id="level-label">Màn 1</div>
        <div class="timer" id="timer" role="timer" aria-label="Thời gian còn lại">
          <div class="timer-fill" id="timer-fill"></div>
          <span class="timer-clock" aria-hidden="true"></span>
          <span class="timer-text" id="time">02:05</span>
        </div>
        <button class="gear glossy" id="game-settings" aria-label="Tạm dừng và cài đặt"></button>
        <div class="order-rail">
          <div class="order-copy">
            <div class="order-heading"><strong id="chapter-label"></strong><span id="row-count"></span></div>
            <p id="chapter-tip"></p>
          </div>
          <button class="glossy" id="guide" type="button">?</button>
        </div>
      </section>
      <div id="pieces" aria-label="Bánh trong khay"></div>
      <p id="status" class="sr-only" role="status"></p>
      <dialog id="modal" aria-labelledby="modal-title">
        <article class="panel">
          <header class="panel-heading">
            <h1 id="modal-title"></h1>
            <p id="modal-subtitle"></p>
          </header>
          <button class="close glossy" id="close-modal" aria-label="Đóng">×</button>
          <div class="panel-body" id="modal-body"></div>
        </article>
      </dialog>
      <canvas id="effects" width="540" height="1172" aria-hidden="true"></canvas>
    </div>
  </main>
</body>
</html>
